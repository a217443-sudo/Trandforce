{% extends 'base.html' %}
{% block content %}
<h2>{{ employee.name }} 的 OKR（{{ year }}）</h2>

<section class="card">
  <h3>新增目標</h3>
  <form method="post" action="{{ url_for('create_goal') }}">
    <input type="hidden" name="employee_id" value="{{ employee.id }}">
    <label>年度 <input type="number" name="year" min="2026" value="{{ year }}" required></label>
    <label>Objective <input type="text" name="objective" required></label>
    <label>Key Result <input type="text" name="key_result" required></label>
    <label>Target <input type="text" name="target" required></label>
    <button type="submit">新增</button>
  </form>
</section>

<section>
  <h3>已建立目標</h3>
  <table>
    <tr><th>Objective</th><th>KR</th><th>Target</th><th>年中%</th><th>年底%</th><th>評分</th><th>更新</th></tr>
    {% for g in goals %}
    <tr>
      <td>{{ g.objective }}</td>
      <td>{{ g.key_result }}</td>
      <td>{{ g.target }}</td>
      <form method="post" action="{{ url_for('update_goal', goal_id=g.id) }}">
        <td><input type="number" name="mid_progress" min="0" max="200" step="0.1" value="{{ g.mid_progress }}"></td>
        <td><input type="number" name="end_progress" min="0" max="200" step="0.1" value="{{ g.end_progress }}"></td>
        <td>
          <select name="score">
            {% for i in range(1, 6) %}
            <option value="{{ i }}" {% if g.score == i %}selected{% endif %}>{{ i }}</option>
            {% endfor %}
          </select>
        </td>
        <td><button type="submit">儲存</button></td>
      </form>
    </tr>
    {% endfor %}
  </table>
</section>

<a href="{{ url_for('dashboard', year=year) }}">回主管儀表板</a>
{% endblock %}
